# Stage 3 (검증) gate for every PR — see .ucompany/sdd/workflow.md
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # 심사 환경(Mac)과 같은 계열
            python: "3.12"
          - os: ubuntu-latest
            python: "3.11"        # pyproject 최소 버전
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (README와 같은 명령)
        run: python -m pip install -r requirements.txt
      - name: V1 SDD 일관성
        run: python .ucompany/scripts/check_sdd.py
      - name: V1 안전 규칙 정적 검사
        run: python .ucompany/scripts/safety_scan.py
      - name: V2 자동 회귀
        run: python -m pytest -q
