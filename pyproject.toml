[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-agent"
version = "0.1.0"
description = "Local state and configuration for the marketing agent"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
