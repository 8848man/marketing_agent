# Dashboard configuration example. Copy to ignored config.yaml if editing by file.
# Keys are stored separately in .env; the UI updates this YAML for channel/profile changes.
profiles: [유튜브1, 유튜브2, 유튜브3]  # 앱 전용 Chrome 프로필 표시 이름, 폴더 경로 아님
channels:  # 영상 불러오기 · 게시 허용 범위
  - UCxlc0Ky0aWoD8uI09ad44Tg  # 외롭여
  - UC-ee_ziASM251TMXe3P3VZA  # 리즈시절 LizTV
  - UC09L3JxGVcn7SKLa-pjTEmw  # 러브커넥트 유지연
  - UCVdtDW-HF4KluixGaBAcI4w  # 연애데이터 노노
  - UCkGl2jieOVhGiHPdXF77Yyw  # 심리조각
channel_names: {}  # 채널 관리에서 저장하는 선택 이름: 채널 ID -> 표시 이름
comment:
  min_chars: 40
  max_chars: 120
  brand: 운명원
brand_settings:
  name: 운명원  # 댓글에 자연스럽게 포함할 브랜드명
  description: 연애 고민을 사주 관점에서 살펴보는 서비스  # AI 초안의 브랜드 맥락
  reference_url: ""  # 선택: 추후 설명 수정 시 참고만 함; URL은 열거나 AI에 전송하지 않음
limits:
  daily_max_comments: 10
ai:  # 선택 제공사/모델만 저장; API 키는 .env에 보관
  provider: openai
  model: gpt-5.4-mini
chrome_profiles: {}  # 연결 시 이 PC의 앱 전용 절대 경로를 자동 저장
selected_chrome_profile: 유튜브1
profile_ids: {}  # 추가 프로필의 내부 ID를 자동 저장; 기본 3개는 내장 ID 사용
# For your own test video, copy this file to ignored config.yaml and fill
# dashboard_test_videos with its exact public video ID, channel ID and title.
# Run dashboard --test-videos-config config.yaml --register-owned-test-video
# with an existing ownership evidence file inside data/dashboard. This records
# your manual ownership review; the app cannot prove ownership automatically.
# The test video must also be present in that channel's current YouTube RSS feed.
# Failed/unavailable RSS checks block posting rather than trusting this file alone.
# A matching human-approved draft is still required before the post button works.
dashboard_test_videos: []
#  - video_id: AbCdEfGhI12
#    channel_id: UCabcdefghijklmnopqrstuv
#    title: Exact title of my test video
